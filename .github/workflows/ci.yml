name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend y simulador
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          # Throwaway password for a database that only lives during this job
          MSSQL_SA_PASSWORD: Kuntur-CI-2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Kuntur-CI-2026 -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 20s
    env:
      KUNTUR_TEST_DATABASE_URL: mssql+pymssql://sa:Kuntur-CI-2026@localhost:1433/master
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Dependencias (desde uv.lock)
        run: uv sync --all-packages --all-groups --frozen

      - name: Formato y lint
        run: |
          uv run ruff format --check backend simulator
          uv run ruff check backend simulator

      - name: Tipos (mypy estricto)
        run: |
          (cd backend && uv run mypy)
          (cd simulator && uv run mypy)

      - name: Pruebas del backend, con SQL Server real
        working-directory: backend
        run: uv run pytest --cov --cov-report=term-missing:skip-covered --cov-fail-under=90

      - name: Pruebas del simulador
        working-directory: simulator
        run: uv run pytest

      - name: Escenarios BDD
        working-directory: backend
        run: uv run behave --format progress

      - name: Evaluación de las explicaciones (plantilla)
        working-directory: backend
        run: uv run python -m evals.run

  images:
    name: Imágenes de contenedor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Construir la API y el simulador
        run: |
          docker build -f backend/Dockerfile -t kuntur-api:ci .
          docker build -f simulator/Dockerfile -t kuntur-sim:ci .
