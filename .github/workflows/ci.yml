name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend y simulador
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          # Throwaway password for a database that only lives during this job
          MSSQL_SA_PASSWORD: Kuntur-CI-2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Kuntur-CI-2026 -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 20s
    env:
      KUNTUR_TEST_DATABASE_URL: mssql+pymssql://sa:Kuntur-CI-2026@localhost:1433/master
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Dependencias (desde uv.lock)
        run: uv sync --all-packages --all-groups --frozen

      - name: Formato y lint
        run: |
          uv run ruff format --check backend simulator
          uv run ruff check backend simulator

      - name: Tipos (mypy estricto)
        run: |
          (cd backend && uv run mypy)
          (cd simulator && uv run mypy)

      - name: Pruebas del backend, con SQL Server real
        working-directory: backend
        run: uv run pytest --cov --cov-report=term-missing:skip-covered --cov-fail-under=90

      - name: Pruebas del simulador
        working-directory: simulator
        run: uv run pytest

      - name: Escenarios BDD
        working-directory: backend
        run: uv run behave --format progress

      - name: Evaluación de las explicaciones (plantilla)
        working-directory: backend
        run: uv run python -m evals.run

  web:
    name: Consola web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencias (con el npm que escribió el lockfile)
        run: |
          npm install -g npm@11.6.2
          npm ci

      - name: Formato
        run: npx prettier --check "src/**/*.{ts,html,css}"

      - name: Pruebas unitarias (Vitest)
        run: npm test -- --watch=false

      - name: Build de producción
        run: npm run build

  e2e:
    name: De punta a punta
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [backend, web]
    env:
      # Throwaway values for a platform that only lives during this job
      KUNTUR_DB_SA_PASSWORD: Kuntur-E2E-2026
      KUNTUR_SIM_CAMERA_PASSWORD: camara-e2e-2026
      KUNTUR_TOKEN_SECRET: solo-para-la-ci-${{ github.run_id }}-0123456789abcdef
      KUNTUR_OPERATOR_PASSWORD: operador-e2e-2026
      KUNTUR_VIEWER_PASSWORD: visitante-e2e-2026
    steps:
      - uses: actions/checkout@v7

      - name: Levantar la plataforma completa
        run: docker compose up --build --detach --wait --wait-timeout 300

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Playwright
        working-directory: e2e
        run: |
          npm install -g npm@11.6.2
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --project=escritorio --project=tableta

      - name: Registros de la plataforma
        if: failure()
        run: docker compose logs --no-color > plataforma.log

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-${{ github.run_id }}
          path: |
            e2e/playwright-report
            e2e/test-results
            plataforma.log
          retention-days: 7
