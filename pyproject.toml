[project]
name = "kuntur-scada-workspace"
version = "0.1.0"
description = "Kuntur SCADA: supervisión y control de flotas de equipos de campo con alertas que se demuestran."
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "simulator"]

[tool.uv.sources]
kuntur = { workspace = true }
kuntur-sim = { workspace = true }
