[project]
name = "kuntur-sim"
version = "0.1.0"
description = "Field device simulator for Kuntur SCADA: UPS over Modbus TCP, barriers over WebSocket and cameras over HTTP Digest, with fault injection."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Angel Cancho" }]
dependencies = [
    "pymodbus>=3.7",
    "websockets>=13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
]

[project.scripts]
kuntur-sim = "kuntur_sim.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kuntur_sim"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N", "S", "ASYNC", "C4", "DTZ", "RET"]
ignore = ["PLR0913", "S311", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["kuntur_sim"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pymodbus.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
