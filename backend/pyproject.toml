[project]
name = "kuntur"
version = "0.1.0"
description = "Kuntur SCADA backend: data acquisition, confirmed alerts, remaining life and supervisory control of field devices."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Angel Cancho" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "pymssql>=2.3",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "pymodbus>=3.7",
    "httpx>=0.27",
    "websockets>=13",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
ai = ["google-genai>=1.0"]

[project.scripts]
kuntur-api = "kuntur.main:run"

[dependency-groups]
dev = [
    "kuntur-sim",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6.112",
    "behave>=1.2.6",
    "schemathesis>=3.36",
    "mutmut>=3",
    "ruff>=0.6",
    "mypy>=1.11",
    "testcontainers>=4.8",
]

[tool.uv.sources]
kuntur-sim = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kuntur"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N", "S", "ASYNC", "PT", "TID", "C4", "DTZ", "RET"]
ignore = ["PLR0913", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["kuntur", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106", "PLC0415"]
"features/**" = ["S101", "PLR2004", "N802", "F811"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
exclude = ["/migrations/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymssql.*", "pymodbus.*", "google.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
markers = [
    "integration: needs external services (SQL Server, the device simulator)",
]

[tool.coverage.run]
source = ["kuntur"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.mutmut]
paths_to_mutate = ["src/kuntur/domain/"]
tests_dir = ["tests/unit/domain/", "tests/property/"]
